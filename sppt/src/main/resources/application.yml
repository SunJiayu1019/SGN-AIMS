spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/sppt?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 1019 # 这里改成你自己的MySQL密码
  # 文件上传大小限制（图片上传用）
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.sppt.entity
  configuration:
    map-underscore-to-camel-case: true   # 关键：下划线自动转驼峰

# 上传文件保存目录（相对启动目录；可改成绝对路径，如 D:/sppt-uploads）
file:
  upload-dir: ./uploads
